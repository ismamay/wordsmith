name: Build and Push Wordsmith

on:
  pull_request:
    types: [labeled]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            ismamay/wordsmith:web
            ismamay/wordsmith:web-${{ github.sha }}
            ismamay/wordsmith:web-latest

  build-words:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push words
        uses: docker/build-push-action@v5
        with:
          context: ./words
          push: true
          tags: |
            ismamay/wordsmith:words
            ismamay/wordsmith:words-${{ github.sha }}
            ismamay/wordsmith:words-latest

  build-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push db
        uses: docker/build-push-action@v5
        with:
          context: ./db
          push: true
          tags: |
            ismamay/wordsmith:db
            ismamay/wordsmith:db-${{ github.sha }}
            ismamay/wordsmith:db-latest